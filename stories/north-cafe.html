<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Северное кафе // Лев Орлов</title><link rel="stylesheet" href="../styles.css"></head><body><main class="story-page"><a href="../index.html">← вернуться к доске</a><p class="eyebrow">дело № 07 / рассказ 02</p><h1>Северное кафе</h1><p class="story-lede">Две чашки. Один человек. Время — 22:41.</p><p>Официантка поставила кофе напротив пустого стула и ушла, не оборачиваясь. За окном снег стирал вывески, номера домов и все причины оставаться.</p><p>Наутро в чеке появилась третья строка: «за ожидание».</p></main></body></html>
