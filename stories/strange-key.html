<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Чужой ключ // Лев Орлов</title><link rel="stylesheet" href="../styles.css"></head><body><main class="story-page"><a href="../index.html">← вернуться к доске</a><p class="eyebrow">дело № 07 / рассказ 06</p><h1>Чужой ключ</h1><p class="story-lede">Подходит ко всем замкам, кроме нужного.</p><p>Ключ нашёлся в кармане старого пальто. Он открывал почтовые ящики, чердаки и забытые чемоданы. Но дверь в его собственную комнату не поддалась.</p><p>За дверью кто-то тихо повернул замок с другой стороны.</p></main></body></html>
